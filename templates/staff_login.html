{% extends "base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<h1>Staff login</h1>
<form method="POST">
    <label>Membership number:</label><br>
    <input type="text" name="membership_number" required><br><br>
    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>
    <button type="submit">Log in</button>
</form>
<br>
<a href="{{ url_for('home') }}">Home</a>
{% endblock %}
